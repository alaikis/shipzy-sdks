[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "zymeup-sdk"
version = "1.2.0"
description = "Official Zymeup logistics platform Python SDK"
authors = ["Zymeup Team"]
license = "MIT"
readme = "README.md"
keywords = ["zymeup", "logistics", "sdk"]
packages = [{ include = "zymeup_sdk" }]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
